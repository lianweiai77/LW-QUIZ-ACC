            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
            font-size: 16px;
        }
        .quiz-table th, .quiz-table td {
            border: 1px solid #ccc;
            padding: 8px 12px;
            text-align: center;
        }
        .quiz-table th {
            background-color: #f2f2f2;
            font-weight: bold;
        }

            font-size: 20px;
            color: #2c3e50;
            font-weight: bold;
            text-align: center

        {

            question: "甲公司為一製造業，請寫出下列會計分錄<br>全年度直接人工費用240,000元；薪資費用216,000元，於108.12.31銀行存款直接轉帳支付。",
            rows: [

        },
        {
            id: 23,
            type: "table_fill", // 表格填充題(分錄)
            title: "題目 23：編表題",
            question:"甲公司為一製造業，請依照以下資訊作各固定資產之折舊攤銷分錄。<br><br>假設：<br>1.期末原料為新台幣50,000元；期末製成品為30,000元<br>2.廠房耐用年限為十年；機器設備耐用年限為五年；電腦設備耐用年限為三年，折舊攤提採直線法",
            tableTitle: "營業成本表",
            headers: ["原料","金額"],
            rows: [
                    ["　　期初原料", { inputId: "q1_t5_1", placeholder: " " }],
                    ["　　本期進料", { inputId: "q1_t5_2", placeholder: " " }],
                    ["　　減：期末原料", "（　　　50,000）"],
                    ["本期耗料（小計）", { inputId: "q1_t5_4", placeholder: " " }],
                    ["直接人工", { inputId: "q1_t5_5", placeholder: " " }],
                    ["製造費用", { inputId: "q1_t5_6", placeholder: " " }],
                    ["　　修繕費", { inputId: "q1_t5_7", placeholder: " " }],
                    ["　　折舊費用", { inputId: "q1_t5_8", placeholder: " " }],
                    ["製造成本", { inputId: "q1_t5_9", placeholder: " " }],
                    ["　　期初製成品", { inputId: "q1_t5_10", placeholder: " " }],
                    ["　　減：期末製成品", { inputId: "q1_t5_11", placeholder: " " }],
                    ["營業成本", { inputId: "q1_t5_12", placeholder: " " }]
                ],
        },
    ];

    let currentQIndex = 0;
    let studentName = "";
    let answers = []; // 儲存答題結果與思考時間
    
    // 時間計數變數
    let totalSec = 40 * 60; // 40分鐘
    let qSec = 0;          // 本題思考時間 (僅在背景累計，不顯示在前端)
    let totalInterval = null;
    let qInterval = null;

    // === 開始考試 ===
    function startExam() {
        const nameInput = document.getElementById("student-name").value.trim();
        if (!nameInput) {
            alert("請輸入姓名！");
            return;
        }
        studentName = nameInput;

        document.getElementById("start-page").classList.add("hidden");
        document.getElementById("timer-container").classList.remove("hidden");
        document.getElementById("exam-page").classList.remove("hidden");

        startTotalTimer();
        loadQuestion(0);
    }

    // === 時間格式化 (分:秒) ===
    function formatTime(sec) {
        let m = Math.floor(sec / 60);
        let s = sec % 60;
        return `${m < 10 ? '0' + m : m}:${s < 10 ? '0' + s : s}`;
    }

    // === 總倒計時器 (顯示在前端) ===
    function startTotalTimer() {
        totalInterval = setInterval(() => {
            totalSec--;
            document.getElementById("total-timer").innerText = formatTime(totalSec);
            if (totalSec <= 0) {
                clearInterval(totalInterval);
                clearInterval(qInterval);
                alert("考試時間到！系統將自動提交答案。");
                saveCurrentAnswer();
                submitExam();
            }
        }, 1000);
    }

    // === 單題思考時間計時器 (純背景紀錄，不更新畫面) ===
    function startQuestionTimer() {
        qSec = 0; // 重置本題秒數
        clearInterval(qInterval);
        qInterval = setInterval(() => {
            qSec++; // 純在背景累計秒數
        }, 1000);
    }

    // === 載入題目 ===
    function loadQuestion(index) {
        startQuestionTimer();
        const q = questions[index];
        document.getElementById("question-title").innerText = q.title;
    
        let html = `<p style="font-size: 18px;">${q.question}</p>`;
        
        if (q.type === "single") {
            html += `<div class="options">`;
                q.options.forEach((opt) => {
                    html += `<label><input type="radio" name="q_opt" value="${opt}"> ${opt}</label>`;
                });
                html += `</div>`;
            } else if (q.type === "fill") {
                html += `<input type="text" id="fill-answer" placeholder="請在此輸入答案">`;
            } else if (q.type === "entry") {
                html += `
                <table class="entry-table">
                    <tr><th>借/貸</th><th>會計項目</th><th>金額</th></tr>
                    `;
                    q.rows.forEach((row, idx) => {
                        html += `
                        <tr>
                            <td>${row.type}</td>
                            <td><input type="text" id="account_${idx}" placeholder="項目"></td>
                            <td><input type="text" id="amount_${idx}" placeholder="金額"></td>
                        </tr>
                        `;
                    });
                    html += `</table>`;
            } else if (q.type === "table_fill") {
                // === 新增：表格填空題渲染 ===
                if (q.tableTitle) {
                    html += `<h4 class="table-caption">${q.tableTitle}</h4>`;
                }

                html += `<table class="fill-table"><thead><tr>`;
                q.headers.forEach(h => {
                    html += `<th>${h}</th>`;
                });
                html += `</tr></thead><tbody>`;
                
                q.rows.forEach(row => {
                    html += `<tr>`;
                        row.forEach(cell => {
                            if (typeof cell === "object" && cell.inputId) {
                                // 如果是空格物件，渲染 input 輸入框
                                html += `<td><input type="text" id="${cell.inputId}" placeholder="${cell.placeholder || ''}"></td>`;
                            } else {
                                // 一般文字欄位
                                html += `<td>${cell}</td>`;
                            }
                        });
                        html += `</tr>`;
                });
                html += `</tbody></table>`;
            } else if (q.type === "multi_table_fill") {
                // 跑迴圈渲染多個表格
                q.tables.forEach(table => {
                    if (table.title) {
                        html += `<h4 style="margin-top: 15px; margin-bottom: 5px;">${table.title}</h4>`;
                    }
                    html += `<table class="fill-table"><thead><tr>`;
                        table.headers.forEach(h => {
                            html += `<th>${h}</th>`;
                        });
                    html += `</tr></thead><tbody>`;
                        
                    table.rows.forEach(row => {
                        html += `<tr>`;
                        row.forEach(cell => {
                            if (typeof cell === "object" && cell.inputId) {
                                html += `<td><input type="text" id="${cell.inputId}" placeholder="${cell.placeholder || ''}"></td>`;
                            } else {
                                html += `<td>${cell}</td>`;
                            }
                        });
                        html += `</tr>`;
                    });
                    html += `</tbody></table>`;
                });
            }

            document.getElementById("question-content").innerHTML = html;
            
            if (index === questions.length - 1) {
                document.getElementById("next-btn").innerText = "完成並提交";
            } else {
                document.getElementById("next-btn").innerText = "下一題";
            }
        }

    // === 紀錄答案與該題思考時間 ===
    function saveCurrentAnswer() {
        const q = questions[currentQIndex];
        let userAns = "";

        if (q.type === "single") {
            const selected = document.querySelector('input[name="q_opt"]:checked');
            userAns = selected ? selected.value : "未作答";
        } else if (q.type === "fill") {
            const val = document.getElementById("fill-answer").value.trim();
            userAns = val !== "" ? val : "未作答";
        } else if (q.type === "entry") {
            let entryDetails = [];
            q.rows.forEach((row, idx) => {
                const acc = document.getElementById(`account_${idx}`).value.trim() || "未填寫";
                const amt = document.getElementById(`amount_${idx}`).value.trim() || "未填寫";
                entryDetails.push(`[${row.type}] ${acc}: $${amt}`);
            });
            userAns = entryDetails.join(" | ");
        } else if (q.type === "table_fill") {
            // === 新增：收集表格內所有填空的值 ===
            let fillResults = [];
            q.rows.forEach(row => {
                row.forEach(cell => {
                    if (typeof cell === "object" && cell.inputId) {
                        const el = document.getElementById(cell.inputId);
                        const val = el && el.value.trim() !== "" ? el.value.trim() : "未填寫";
                        fillResults.push(`空格(${cell.inputId}): ${val}`);
                    }
                });
            });
            userAns = fillResults.join(" | ");
        } else if (q.type === "multi_table_fill") {
            // 在 saveCurrentAnswer 函式內新增此判斷：
            let fillResults = [];
            q.tables.forEach(table => {
                table.rows.forEach(row => {
                    row.forEach(cell => {
                        if (typeof cell === "object" && cell.inputId) {
                            const el = document.getElementById(cell.inputId);
                            const val = el && el.value.trim() !== "" ? el.value.trim() : "未填寫";
                            fillResults.push(`空格(${cell.inputId}): ${val}`);
                        }
                    });
                });
            });
            userAns = fillResults.join(" | ");
        }

        // 保存答案時同時記錄思考時間
        answers.push({
            questionId: q.id,
            title: q.title,
            answer: userAns,
            timeSpentSec: qSec,
            timeSpentFormatted: formatTime(qSec)
        });
    }

    // === 下一題 ===
    function nextQuestion() {
        saveCurrentAnswer();
        currentQIndex++;

        if (currentQIndex < questions.length) {
            loadQuestion(currentQIndex);
        } else {
            clearInterval(totalInterval);
            clearInterval(qInterval);
            submitExam();
        }
    }

    // === 提交並寄信 ===
    function submitExam() {
        document.getElementById("exam-page").classList.add("hidden");
        document.getElementById("timer-container").classList.add("hidden");
        document.getElementById("finish-page").classList.remove("hidden");

        const totalSpentSec = (40 * 60) - totalSec;
        const totalSpentFormatted = formatTime(totalSpentSec);

        // 整理信件內容：包含各題回答與背景紀錄的思考時間
        let answersDetailText = "";
        answers.forEach(a => {
            answersDetailText += `${a.title}\n`;
            answersDetailText += `回答內容：${a.answer}\n`;
            answersDetailText += `思考時間：${a.timeSpentFormatted} (${a.timeSpentSec} 秒)\n`;
            answersDetailText += `----------------------------------------\n`;
        });

        const templateParams = {
            student_name: studentName,
            total_time: totalSpentFormatted,
            answers_detail: answersDetailText
        };

        if (EMAILJS_PUBLIC_KEY === "YOUR_PUBLIC_KEY") {
            console.log("未設定 EmailJS，測驗結果與思考時間如下：", templateParams);
            document.getElementById("finish-message").innerText = "測驗已結束。";
            return;
        }

        emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams)
            .then(function(response) {
                console.log('SUCCESS!', response.status, response.text);
            }, function(error) {
                console.error('FAILED...', error);
                alert("答案提交發送失敗，請聯繫管理員。");
            });
    }
</script>
